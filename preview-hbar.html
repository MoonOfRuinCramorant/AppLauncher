<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>FloatBall 水平选择框 - 布局预览</title>
  <link rel="stylesheet" href="floatball.css">
  <style>
    /* Page chrome */
    body.preview {
      background: #2a2a2a;
      margin: 40px;
      color: #eee;
      font-family: "Segoe UI", sans-serif;
    }
    h1 { font-size: 18px; margin-bottom: 12px; }
    .label {
      font-size: 13px;
      color: #ccc;
      margin: 18px 0 6px;
    }
    /* Simulate the transparent always-on-top Electron window (348x56) */
    .win {
      width: 348px;
      height: 56px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      position: relative;
      margin: 10px 0;
      overflow: visible;
    }
    .win.small { width: 56px; }
    .note {
      font-size: 11px;
      color: #888;
      margin-left: 12px;
    }
  </style>
</head>
<body class="preview">
  <h1>FloatBall 水平选择框 - 布局预览（v1.1.6）</h1>
  <p class="note">单击悬浮球：球纹丝不动 · 左侧弹出圆角卡片"框" · 图标紧贴球 · 无滚动条 · 与应用同高</p>

  <div class="label">▶ 收起态（单击前）：56×56 悬浮球</div>
  <div class="win small">
    <div id="ball" class="float-ball"><span class="ball-icon">🚀</span></div>
  </div>

  <div class="label">▶ 展开态（5 个最近应用）：348×56，框紧贴球左侧</div>
  <div class="win" id="win5"></div>

  <div class="label">▶ 展开态（仅 2 个最近应用）：框自适应宽度，仍紧贴球</div>
  <div class="win" id="win2"></div>

  <p class="note">
    ✓ 球的右边缘仍在原屏幕位置（窗口左扩，右沿不动）<br>
    ✓ 球与图标垂直中心对齐（top:4-52，中心=28）<br>
    ✓ overflow:hidden + flex-wrap:nowrap，永不出现滚动条
  </p>

  <script>
    // The production CSS targets body.popup-horizontal — put the class on
    // the real <body> (both preview windows then render in bar mode).
    document.body.classList.add('popup-horizontal');

    // Build a horizontal popup inside the given .win element.
    function buildBar(containerId, icons) {
      const container = document.getElementById(containerId);
      const ball = document.createElement('div');
      ball.id = 'ball';
      ball.className = 'float-ball';
      ball.innerHTML = '<span class="ball-icon">🚀</span>';
      container.appendChild(ball);
      const popup = document.createElement('div');
      popup.id = 'popup';
      popup.className = 'float-popup';
      popup.style.display = 'block';
      const list = document.createElement('div');
      list.id = 'appList';
      list.className = 'popup-app-list';
      icons.forEach(ic => {
        const item = document.createElement('div');
        item.className = 'popup-app-item';
        item.innerHTML = '<div class="popup-app-item-icon">' + ic + '</div>';
        list.appendChild(item);
      });
      popup.appendChild(list);
      container.appendChild(popup);
    }
    buildBar('win5', ['📁', '🌐', '💻', '🎵', '⚙️']);
    buildBar('win2', ['📁', '🌐']);
  </script>
</body>
</html>
